<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafetyTrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span>SafetyTrace</div>
  <label class="sel"><span class="sr">Case</span><select id="caseSel"></select></label>
  <label class="sel small"><span class="sr">Run</span><select id="runSel" title="Open a saved run or start a new one"></select></label>
  <button id="runBtn" class="btn primary">Run agent</button>
  <button id="resetBtn" class="btn ghost" title="Start this case again from scratch (saved runs stay in the Run menu)">Reset case</button>
  <div class="facts" id="facts"></div>
  <div class="spacer"></div>
  <span id="mode" class="mode"></span>
  <label class="who" title="Your name is recorded in the audit log"><span class="sr">Reviewer</span><input id="who" value="Reviewer" size="9"></label>
  <button id="themeBtn" class="btn ghost" title="Switch light / dim theme" aria-label="Switch theme">Light</button>
  <button id="signBtn" class="btn sign" disabled>Sign off</button>
</header>

<div class="strip" id="strip"></div>

<div class="body">
  <nav class="rail" id="rail">
    <button data-v="review" class="on" title="Narrative and case form, linked to the source"><b>✎</b><span>Review</span></button>
    <button data-v="coverage" title="The case pack: original files, and what was made of every passage"><b>◧</b><span>Sources</span></button>
    <button data-v="decide" title="Conflicts, questions, MedDRA, expectedness"><b>⚖</b><span>Decide</span></button>
    <button data-v="agent" title="What the agent did, step by step"><b>⟳</b><span>Agent</span></button>
    <button data-v="report" title="The final output document (printable)"><b>▣</b><span>Report</span></button>
    <button data-v="export" title="Exports and audit log"><b>⇩</b><span>Export</span></button>
    <div class="key" aria-label="Colour key">
      <i style="--k:var(--c-input)">Source</i><i style="--k:var(--c-output)">AI draft</i><i style="--k:var(--c-proof)">Proof</i>
      <i style="--k:var(--c-human)">You</i><i style="--k:var(--c-agent)">Agent</i><i style="--k:var(--c-record)">Record</i>
    </div>
  </nav>
  <main id="main"><div class="empty">Loading cases…</div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=11"></script>
</body>
</html>
